<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Jari Ajaib</title>
<meta name="theme-color" content="#b57bff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jari Ajaib">
<style>
  :root {
    --pink: #ff8fc7; --pink-d: #e85aa5; --lilac: #c9a7ff; --lilac-d: #9b6cf0;
    --ink: #5b2a63; --mint: #7fe0b8; --mint-d: #3fb98a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Comic Sans MS", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 15% 8%, #ffe3f3 0, transparent 40%),
                radial-gradient(circle at 85% 92%, #e6dcff 0, transparent 45%),
                linear-gradient(160deg, #fff0f8, #f0e8ff);
    background-attachment: fixed;
    touch-action: manipulation; user-select: none; -webkit-user-select: none; overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .screen { padding: max(16px, env(safe-area-inset-top)) 16px 32px; max-width: 900px; margin: 0 auto; }
  [hidden] { display: none !important; }
  h1 { text-align: center; font-size: clamp(32px, 7.5vw, 58px); margin: 8px 0 4px; color: var(--lilac-d);
       text-shadow: 3px 3px 0 #fff, 5px 5px 0 var(--pink); line-height: 1.1; }
  .sub { text-align: center; font-size: clamp(16px, 3.4vw, 22px); margin: 0 0 18px; }
  .mascot { display: block; text-align: center; font-size: clamp(52px, 11vw, 88px); animation: bob 2.4s ease-in-out infinite; }

  /* --- peta --- */
  #btn-book { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 5; background: #fff; border-radius: 22px;
              padding: 10px 16px; font-size: 22px; font-weight: 800; box-shadow: 0 5px 0 var(--lilac), 0 8px 18px #9b6cf044; }
  .world { background: var(--bg); border-radius: 32px; padding: 14px 10px 22px; margin: 16px 0; box-shadow: inset 0 -6px 0 #0000000d; }
  .world h2 { margin: 0 0 10px; text-align: center; font-size: clamp(22px, 5vw, 30px); }
  .world h2 small { display: block; font-size: .65em; font-weight: 700; opacity: .75; }
  .path { display: flex; flex-direction: column; align-items: center; gap: 14px;
          background: repeating-linear-gradient(to bottom, #fff 0 12px, transparent 12px 24px) center / 6px 100% no-repeat; }
  .node { background: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
          transform: translateX(calc(var(--x) * min(22vw, 140px))); }
  .dot { position: relative; width: 86px; height: 86px; border-radius: 50%; background: #fff; display: grid; place-items: center;
         font-size: 38px; font-weight: 900; color: var(--lilac-d); box-shadow: 0 6px 0 var(--lilac), 0 10px 20px #9b6cf033; }
  .node:active .dot { transform: translateY(4px); box-shadow: 0 2px 0 var(--lilac); }
  .node.done .dot { background: #fff7c7; box-shadow: 0 6px 0 #f5b400; color: #c78a00; }
  .node.locked { opacity: .6; filter: grayscale(.7); }
  .node:not(.locked):not(.done) .dot { animation: glow 1.6s ease-in-out infinite; }
  .badge { position: absolute; right: -10px; top: -10px; font-size: 34px; font-style: normal; }
  .node .nm { font-weight: 800; font-size: 15px; background: #ffffffcc; padding: 2px 10px; border-radius: 12px; max-width: 46vw; text-align: center; }
  .node .st { color: #f5b400; font-size: 18px; letter-spacing: 2px; }
  #btn-reset { display: block; margin: 24px auto 0; background: none; opacity: .5; font-size: 14px; text-decoration: underline; }

  /* --- buku stiker --- */
  #stickers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sticker { background: #fff; border-radius: 24px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;
             box-shadow: 0 5px 0 var(--pink), 0 8px 16px #ff8fc733; }
  .sticker .em { font-size: clamp(44px, 12vw, 72px); }
  .sticker .nm { font-size: 14px; font-weight: 800; text-align: center; }
  .sticker.empty { background: #f1ecf4; box-shadow: 0 5px 0 #ddd3e3; }
  .sticker.empty .em { filter: brightness(0); opacity: .18; }
  .wiggle { animation: wiggle .6s; }
  #book-full { text-align: center; font-size: 22px; font-weight: 800; color: var(--pink-d); }

  /* --- game --- */
  .topbar { display: flex; align-items: center; gap: 8px; }
  .round { width: 54px; height: 54px; border-radius: 50%; background: #fff; font-size: 26px; flex: none; box-shadow: 0 4px 0 var(--lilac); }
  #progress { flex: 1; display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
  #progress span { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid var(--lilac); }
  #progress .ok { background: var(--mint); border-color: var(--mint-d); }
  #progress .no { background: #f3a6c4; border-color: var(--pink-d); }
  #progress .now { border-color: var(--pink-d); transform: scale(1.3); }
  #timer { height: 12px; background: #fff; border-radius: 8px; margin-top: 10px; overflow: hidden; }
  #timer i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--lilac)); animation: drain linear forwards; }
  .helper { display: flex; align-items: flex-end; gap: 8px; margin: 12px 0 8px; }
  .helper .mascot { font-size: 56px; display: inline-block; }
  #bubble { background: #fff; border-radius: 22px 22px 22px 4px; padding: 10px 16px; font-size: clamp(16px, 3.4vw, 22px); font-weight: 700;
            box-shadow: 0 4px 12px #e85aa522; margin-bottom: 26px; min-height: 1.6em; }
  .card { background: #fff; border-radius: 32px; padding: 16px 10px; text-align: center; box-shadow: 0 8px 0 var(--pink), 0 14px 30px #ff8fc744; }
  #eq { font-size: clamp(34px, 9vw, 64px); font-weight: 900; color: var(--pink-d); min-height: 1.3em; }
  .hands { display: flex; justify-content: center; gap: 2%; margin-top: 6px; }
  .hand { margin: 0; width: min(46%, 270px); transition: opacity .3s; }
  .hand figcaption { font-weight: 800; font-size: clamp(13px, 3vw, 18px); }
  .hand svg { width: 100%; height: auto; display: block; overflow: visible; }
  .focusL #hand-R { opacity: .35; }
  .palm { fill: #ffd9c2; stroke: #d99a7c; stroke-width: 3; }
  .f { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(.46); transition: transform .45s cubic-bezier(.5, 1.6, .5, 1); }
  .f.on { transform: none; }
  .f rect { fill: #f6c9ad; stroke: #d99a7c; stroke-width: 3; transition: fill .3s; }
  #hand-R .f.on rect { fill: #6ec6ff; stroke: #3a9be0; }
  #hand-R .thumb.on rect { fill: #ffc93c; stroke: #e0a200; }
  #hand-L .f.on rect { fill: #5fd3a5; stroke: #2fae7d; }
  #hand-L .thumb.on rect { fill: #b57bff; stroke: #8a4be0; }
  .f.chg rect { stroke: #ff3d8b !important; stroke-width: 6; }
  .f text { fill: #fff; font-weight: 900; font-size: 17px; text-anchor: middle; opacity: 0; paint-order: stroke; stroke: #0003; stroke-width: 2px; }
  .labels .f.on text { opacity: 1; }
  #choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 22px; }
  .choice { background: var(--lilac); color: #fff; font-size: clamp(32px, 8vw, 56px); font-weight: 900; padding: 14px 0;
            border-radius: 26px; box-shadow: 0 7px 0 var(--lilac-d); text-shadow: 2px 2px 0 #0002; }
  .choice:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--lilac-d); }
  .choice.bub { border-radius: 50%; aspect-ratio: 1; padding: 0; background: radial-gradient(circle at 30% 30%, #fff 0 12%, #b9e4ff 13%, #7cc4ff);
                box-shadow: 0 6px 16px #3a9be055; animation: float 2.4s ease-in-out infinite; }
  .choice.bub:nth-child(2) { animation-delay: .4s; } .choice.bub:nth-child(3) { animation-delay: .8s; } .choice.bub:nth-child(4) { animation-delay: 1.2s; }
  .choice.right { background: var(--mint); box-shadow: 0 7px 0 var(--mint-d); animation: pop .4s; }
  .choice.wrong { background: #f3c7d9; box-shadow: 0 7px 0 #e3a3bd; animation: shake .4s; }
  .choice:disabled:not(.right):not(.wrong) { opacity: .5; }
  @media (max-width: 480px) { #choices { grid-template-columns: repeat(2, 1fr); } }

  /* --- hasil & sertifikat --- */
  #result { text-align: center; padding-top: 8vh; }
  #result-sticker { font-size: clamp(90px, 24vw, 150px); animation: pop .7s; }
  #result-score { font-size: clamp(22px, 5vw, 32px); font-weight: 800; }
  #result-text { font-size: clamp(24px, 6vw, 38px); font-weight: 800; color: var(--pink-d); margin: 8px 0 26px; }
  .big-btn { display: block; width: min(360px, 100%); margin: 14px auto; padding: 16px; border-radius: 28px; font-size: 24px; font-weight: 800;
             background: var(--pink); color: #fff; box-shadow: 0 7px 0 var(--pink-d); }
  .big-btn.alt { background: #fff; color: var(--ink); box-shadow: 0 7px 0 var(--lilac); }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  .certcard { background: #fffdf3; border: 10px double #f5b400; border-radius: 28px; padding: 24px 16px; text-align: center; margin-top: 16px; }
  .certcard .big { font-size: clamp(80px, 20vw, 130px); }
  .certcard h2 { margin: 4px 0; color: #c78a00; font-size: clamp(24px, 6vw, 38px); }
  #cert-name { font: inherit; font-size: clamp(24px, 6vw, 36px); font-weight: 900; text-align: center; color: var(--lilac-d);
               border: 0; border-bottom: 3px dashed var(--lilac); background: transparent; width: min(420px, 100%); margin: 10px 0; }

  .confetti { position: fixed; top: -50px; font-size: 32px; pointer-events: none; animation: fall 1.8s ease-in forwards; z-index: 9; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-4deg); } }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes wiggle { 20% { transform: rotate(-10deg) scale(1.1); } 40% { transform: rotate(10deg) scale(1.1); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(6deg); } }
  @keyframes float { 50% { transform: translateY(-10px); } }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes glow { 50% { box-shadow: 0 6px 0 var(--lilac), 0 0 0 10px #ff8fc755; } }
  @keyframes drain { from { width: 100%; } to { width: 0; } }
  @media (prefers-reduced-motion: reduce) { .confetti, .mascot, .bub, .pulse, .dot { animation: none !important; } }
</style>
</head>
<body>
  <section id="map" class="screen">
    <button id="btn-book" aria-label="Buku stiker">📖 0/18</button>
    <span class="mascot">🧚‍♀️</span>
    <h1>Petualangan<br>Jari Ajaib</h1>
    <p class="sub">Berhitung 1–99 dengan 10 jari 🖐️🖐️</p>
    <div id="worlds"></div>
    <button id="btn-reset">Ulang dari awal (orang tua)</button>
  </section>

  <section id="book" class="screen" hidden>
    <div class="topbar"><button id="btn-book-back" class="round" aria-label="Kembali">🗺️</button>
      <h1 style="flex:1;font-size:clamp(26px,6vw,44px)">Buku Stiker</h1></div>
    <p id="book-full">🎉 Buku stiker penuh! Kamu juara! 🎉</p>
    <div id="stickers"></div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="topbar">
      <button id="btn-back" class="round" aria-label="Peta">🗺️</button>
      <div id="progress"></div>
      <button id="btn-hint" class="round" aria-label="Bantuan">💡</button>
      <button id="btn-speak" class="round" aria-label="Dengar soal">🔊</button>
    </div>
    <div id="timer" hidden></div>
    <div class="helper"><span class="mascot">🧚‍♀️</span><div id="bubble"></div></div>
    <div class="card">
      <div id="eq"></div>
      <div id="hands" class="hands">
        <figure id="hand-L" class="hand"><figcaption>✋ Kiri · Puluhan</figcaption></figure>
        <figure id="hand-R" class="hand"><figcaption>Kanan · Satuan 🤚</figcaption></figure>
      </div>
    </div>
    <div id="choices"></div>
    <div id="after"></div>
  </section>

  <section id="result" class="screen" hidden>
    <div id="result-sticker"></div>
    <div id="result-score"></div>
    <div id="result-text"></div>
    <button id="btn-cert" class="big-btn pulse">Lihat Sertifikat 🏆</button>
    <button id="btn-next" class="big-btn">Level Berikutnya ➜</button>
    <button id="btn-again" class="big-btn alt">Main Lagi 🔁</button>
    <button id="btn-home" class="big-btn alt">Peta Petualangan 🗺️</button>
  </section>

  <section id="cert" class="screen" hidden>
    <div class="certcard">
      <div>🌸 Sertifikat Kelulusan 🌸</div>
      <div class="big">👸</div>
      <h2>Ratu Matematika Jari Ajaib</h2>
      <div>diberikan kepada</div>
      <input id="cert-name" placeholder="tulis nama" maxlength="30" aria-label="Nama">
      <div>telah menamatkan 18 level dan mengumpulkan 18 stiker</div>
      <p id="cert-date"></p>
    </div>
    <button id="btn-cert-back" class="big-btn">Peta Petualangan 🗺️</button>
  </section>

  <script src="game.js"></script>
</body>
</html>
